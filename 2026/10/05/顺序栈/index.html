    <h1 id="顺序栈"><a href="#顺序栈" class="headerlink" title="顺序栈"></a>顺序栈</h1><figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span><span class="string">&lt;stdio.h&gt;</span> </span></span><br><span class="line"></span><br><span class="line"><span class="meta">#<span class="keyword">define</span> Stack_Size 50 <span class="comment">//栈中元素50个</span></span></span><br><span class="line"><span class="keyword">typedef</span> <span class="class"><span class="keyword">struct</span>&#123;</span></span><br><span class="line">    <span class="type">int</span> elem[Stack_Size]; <span class="comment">/*用一维数组存放栈中元素*/</span></span><br><span class="line">    <span class="type">int</span> top;<span class="comment">/*存放栈顶元素的下标 top=-1 为空栈*/</span> </span><br><span class="line">&#125;SeqStack; </span><br><span class="line"></span><br><span class="line"><span class="comment">//初始化顺序栈 </span></span><br><span class="line"><span class="type">void</span> <span class="title function_">InitStack</span><span class="params">(SeqStack *S)</span></span><br><span class="line">&#123;</span><br><span class="line">    S-&gt;top=<span class="number">-1</span>; </span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="comment">//进栈</span></span><br><span class="line"><span class="type">int</span> <span class="title function_">Push</span><span class="params">(SeqStack *S,<span class="type">int</span> x)</span></span><br><span class="line">&#123;</span><br><span class="line">    <span class="comment">//判断栈是否满栈</span></span><br><span class="line">    <span class="keyword">if</span> (S-&gt;top == (Stack_Size<span class="number">-1</span>))</span><br><span class="line">        <span class="keyword">return</span> <span class="number">0</span>;<span class="comment">//满栈</span></span><br><span class="line">    S-&gt;top++;<span class="comment">//修改栈顶指针 </span></span><br><span class="line">    S-&gt;elem[S-&gt;top]=x;<span class="comment">//进栈 </span></span><br><span class="line">    <span class="keyword">return</span> <span class="number">1</span>;   </span><br><span class="line">&#125; </span><br><span class="line"></span><br><span class="line"><span class="comment">//出栈</span></span><br><span class="line"><span class="type">int</span> <span class="title function_">Pop</span><span class="params">(SeqStack *S,<span class="type">int</span> *x)</span></span><br><span class="line">&#123;</span><br><span class="line">    <span class="comment">//判断是否为空栈</span></span><br><span class="line">    <span class="keyword">if</span> (S-&gt;top == <span class="number">-1</span>)&#123;</span><br><span class="line">        <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">    &#125;<span class="keyword">else</span>&#123;</span><br><span class="line">        *x=S-&gt;elem[S-&gt;top];<span class="comment">//赋值 </span></span><br><span class="line">        S-&gt;top--;<span class="comment">//修改栈顶指针</span></span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>; </span><br><span class="line">    &#125;     </span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="comment">//读取栈顶元素</span></span><br><span class="line"><span class="type">int</span> <span class="title function_">GetPop</span><span class="params">(SeqStack *S,<span class="type">int</span> *x)</span></span><br><span class="line">&#123;</span><br><span class="line">    <span class="comment">//判断是否为空栈</span></span><br><span class="line">    <span class="keyword">if</span> (S-&gt;top == <span class="number">-1</span>)&#123;</span><br><span class="line">        <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">    &#125;<span class="keyword">else</span>&#123;</span><br><span class="line">        *x=S-&gt;elem[S-&gt;top];<span class="comment">//传值 </span></span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>; </span><br><span class="line">    &#125;     </span><br><span class="line">&#125;</span><br><span class="line"><span class="comment">//10进制转2进制</span></span><br><span class="line"></span><br><span class="line"><span class="type">int</span> <span class="title function_">TtoT</span><span class="params">(SeqStack *S,<span class="type">int</span> x)</span></span><br><span class="line">&#123;</span><br><span class="line">    <span class="keyword">while</span>(<span class="number">1</span>)&#123;</span><br><span class="line">        <span class="type">int</span> a = x%<span class="number">2</span>;</span><br><span class="line">        Push(S,a);</span><br><span class="line">        x = x/<span class="number">2</span>;</span><br><span class="line">        <span class="keyword">if</span> (x==<span class="number">0</span>)&#123;</span><br><span class="line">            <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;  </span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">()</span></span><br><span class="line">&#123;</span><br><span class="line">    SeqStack S;<span class="comment">//定义顺序栈 </span></span><br><span class="line">    InitStack(&amp;S);<span class="comment">//初始化顺序栈 </span></span><br><span class="line">    <span class="type">int</span> x,y;</span><br><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;请输入10进制数\n&quot;</span>);</span><br><span class="line">    <span class="built_in">scanf</span>(<span class="string">&quot;%d&quot;</span>,&amp;x);</span><br><span class="line">    TtoT(&amp;S,x);</span><br><span class="line">    <span class="keyword">while</span>(S.top != <span class="number">-1</span>)&#123;</span><br><span class="line">        Pop(&amp;S,&amp;y);</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%d&quot;</span>,y);</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
